    <script>
      // Apply the saved theme before the app loads, so dark mode never flashes a white page.
      ;(function () {
        var m = document.cookie.match(/(?:^|; )vite-ui-theme=([^;]*)/)
        var t = m ? decodeURIComponent(m[1]) : 'system'
        if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.add(t)
        document.documentElement.style.background = t === 'dark' ? 'oklch(0.129 0.042 264.695)' : '#fff'
      })()
    </script>
  </head>

    <div id="root"></div>
